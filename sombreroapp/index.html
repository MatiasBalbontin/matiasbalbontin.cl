<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sombrero App</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0d0b09;
      --surface:  #191410;
      --border:   #2e2620;
      --text:     #e8e0d4;
      --muted:    #7a6f64;
      --gold:     #c9933a;
      --gold-dim: #7a5820;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      padding: 2rem;
      background-image:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201, 147, 58, 0.07) 0%, transparent 70%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 1.5rem;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 2.5rem;
    }

    .meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .meta span { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
      display: inline-block;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--gold);
      color: #0d0b09;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .btn:hover {
      background: #daa94a;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .btn svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
    }

    .warning {
      margin-top: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .warning strong { color: var(--gold-dim); }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🪮</span>
    <h1>Sombrero App</h1>
    <p class="subtitle">Android · APK directo</p>

    <div class="divider"></div>

    <div class="meta">
      <span><span class="dot"></span>Versión debug</span>
      <span><span class="dot"></span>Requiere Android 6.0+</span>
    </div>

    <a class="btn" href="../enlaces%20ocultos/app-debug.apk" download="SombreroApp.apk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Descargar APK
    </a>

    <p class="warning">
      Habilita <strong>«Instalar apps desconocidas»</strong><br />
      en Ajustes antes de instalar.
    </p>
  </div>
</body>
</html>
