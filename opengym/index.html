<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OpenGym</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#060a0c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #060a0c;
      --surface:   rgba(15, 26, 30, 0.85);
      --border:    rgba(46, 184, 212, 0.12);
      --border-hi: rgba(46, 184, 212, 0.28);
      --text:      #e2f2f8;
      --muted:     #4d7480;
      --accent:    #2eb8d4;
      --accent-hi: #5dd5e8;
      --glow:      rgba(46, 184, 212, 0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 120% 60% at 50% -10%, rgba(46,184,212,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 80% 110%, rgba(46,184,212,0.06) 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.25rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
    }

    /* ── noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.75rem 2rem 2.25rem;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 24px 48px rgba(0,0,0,0.7),
        0 4px 12px rgba(0,0,0,0.5);
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* ── top badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(46,184,212,0.08);
      border: 1px solid var(--border-hi);
      border-radius: 100px;
      padding: 0.3rem 0.9rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.75rem;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ── icon ── */
    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, rgba(46,184,212,0.15) 0%, rgba(46,184,212,0.05) 100%);
      border: 1px solid var(--border-hi);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
      margin-bottom: 1.75rem;
    }

    /* ── meta pills ── */
    .meta {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.35rem 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .pill-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── download button ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 1.1rem 1.5rem;
      min-height: 56px;
      background: linear-gradient(135deg, var(--accent) 0%, #1a9bb5 100%);
      color: #060a0c;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow:
        0 4px 20px rgba(0,0,0,0.5),
        0 1px 0 rgba(255,255,255,0.15) inset;
      transition: filter 0.15s, transform 0.12s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.97);
      filter: brightness(0.9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .btn svg {
      width: 20px; height: 20px;
      flex-shrink: 0;
    }

    /* ── footer note ── */
    .note {
      margin-top: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .note strong {
      color: rgba(46,184,212,0.6);
      font-weight: 500;
    }

    /* ── bottom rule ── */
    .footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: rgba(77,116,128,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      Acceso privado
    </div>

    <div class="icon-wrap">🏋️</div>

    <h1>OpenGym</h1>
    <p class="tagline">Android · v1.2 · APK directo</p>

    <div class="divider"></div>

    <div class="meta">
      <span class="pill"><span class="pill-dot"></span>Versión 1.2</span>
      <span class="pill"><span class="pill-dot"></span>Android 6.0+</span>
      <span class="pill"><span class="pill-dot"></span>ARM / ARM64</span>
    </div>

    <a class="btn" href="../enlaces%20ocultos/openGym-v1.2.apk" download="openGym-v1.2.apk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Descargar APK
    </a>

    <p class="note">
      Activa <strong>«Instalar apps desconocidas»</strong><br />
      en Ajustes · Seguridad antes de instalar.
    </p>

    <div class="footer">Solo para uso interno</div>
  </div>
</body>
</html>
